<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Main Character</title>
<meta name="description" content="AI social-media role-play: make a persona, get followed, go viral or get cancelled.">
<meta name="theme-color" id="themeColor" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Main Character">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: a single phone-width column (max 480px) — sticky top bar, scrolling feed, fixed tab bar; sheets slide up from the bottom. */
:root{
  --bg:#FAF7F8; --surface:#FFFFFF; --surface-2:#F3EEF1; --line:#E8DFE4; --fg:#1B1418; --muted:#6E6168;
  --accent:#E8285F; --accent-ink:#FFFFFF; --accent-soft:#FDE3EB; --blue:#2F6BFF; --gold:#C98A06; --gold-soft:#FFF1CF;
  --good:#18915A; --bad:#D33636; --violet:#6D4DF2; --violet-soft:#ECE7FF; --shadow:0 10px 30px rgba(40,10,25,.14);
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif; --font-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:14px; --col:480px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141013; --surface:#1C171B; --surface-2:#251E24; --line:#352B33; --fg:#F6EEF2; --muted:#A8979F;
  --accent:#FF4D84; --accent-ink:#1A0710; --accent-soft:#3D1627; --blue:#7A9DFF; --gold:#F1B93A; --gold-soft:#3A2C0C;
  --good:#3CC487; --bad:#FF6B6B; --violet:#A894FF; --violet-soft:#2A2340; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141013; --surface:#1C171B; --surface-2:#251E24; --line:#352B33; --fg:#F6EEF2; --muted:#A8979F;
  --accent:#FF4D84; --accent-ink:#1A0710; --accent-soft:#3D1627; --blue:#7A9DFF; --gold:#F1B93A; --gold-soft:#3A2C0C;
  --good:#3CC487; --bad:#FF6B6B; --violet:#A894FF; --violet-soft:#2A2340; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;max-width:var(--col);margin:0 auto;background:var(--surface);border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;position:relative;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.25}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px} .col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0} .wrap{flex-wrap:wrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* base icon size: zero specificity so component rules (.iconbtn svg, .tabs svg…) still win */
:where(svg.i){width:1.2em;height:1.2em;flex:none;display:block}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px}
.logo{font-family:var(--font-display);font-size:24px;letter-spacing:-.01em;color:var(--fg)}
.logo b{color:var(--accent);font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--fg);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;white-space:nowrap}
.pill.energy{background:var(--gold-soft);color:var(--gold)}
.pill.gem{background:var(--violet-soft);color:var(--violet)}
.pill.hot{background:var(--accent-soft);color:var(--accent)}
.pill svg{width:15px;height:15px}

/* bottom tabs */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--muted);position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--fg)}
.tabs button[aria-current="page"] svg{stroke-width:2.4}
.dot{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;display:grid;place-items:center}

/* avatar */
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;position:relative;user-select:none}
.av.sm{width:34px;height:34px;font-size:17px} .av.xs{width:26px;height:26px;font-size:13px}
.av.lg{width:80px;height:80px;font-size:40px} .av.md{width:56px;height:56px;font-size:28px}
.av.news{border-radius:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;font-weight:600;background:var(--fg);color:var(--bg);transition:transform .08s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.sm{gap:6px}
.btn.sm svg{width:16px;height:16px}
.btn.ghost:hover,.btn.soft:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.soft{background:var(--surface-2);color:var(--fg)}
.btn.sm{height:34px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;outline:none;resize:vertical}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:84px;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding-block:12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:5px;width:64px;flex:none;font-size:11.5px;color:var(--muted)}
.story .ring{padding:2.5px;border-radius:50%;background:conic-gradient(var(--accent),var(--gold),var(--violet),var(--accent))}
.story .ring.seen{background:var(--line)}
.story .ring .av{border:2.5px solid var(--surface)}
.story .ell{max-width:64px}
.story .plus{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px;font-weight:700;border:2px solid var(--surface)}

/* composer */
.composer{display:flex;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.composer textarea{border:0;outline:none;resize:none;width:100%;min-height:52px;background:transparent;font-size:17px;padding:8px 0 0}
.composer .bar{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.boost{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;border:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.boost[aria-pressed="true"]{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* posts */
.post{display:flex;gap:12px;padding-block:13px;border-bottom:1px solid var(--line);cursor:pointer}
.post:hover{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.post .who{display:flex;align-items:baseline;gap:5px;min-width:0}
.post .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.post .handle{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .text{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.post .acts{display:flex;justify-content:space-between;max-width:330px;margin-top:9px;color:var(--muted);font-size:13px}
.post .acts button{display:inline-flex;align-items:center;gap:5px;padding:3px 4px;border-radius:8px}
.post .acts svg{width:18px;height:18px}
.post .acts .on-like{color:var(--accent)} .post .acts .on-rt{color:var(--good)}
.badge{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--blue);color:#fff;flex:none;align-self:center}
.badge svg{width:11px;height:11px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:6px}
.tag.viral{background:var(--accent-soft);color:var(--accent)}
.tag.cancel{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.tag.news{background:var(--surface-2);color:var(--muted)}
.tag.drama{background:var(--violet-soft);color:var(--violet)}
.thread-main{padding-block:14px;border-bottom:1px solid var(--line)}
.thread-main .text{font-size:18px;white-space:pre-wrap;word-break:break-word;margin-top:10px}
.actbar{display:flex;justify-content:space-around;padding-block:8px;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}
.actbar button{display:inline-flex;gap:6px;align-items:center;padding:4px 8px;border-radius:8px}
.actbar svg{width:19px;height:19px}
.actbar .on-like{color:var(--accent)} .actbar .on-rt{color:var(--good)}
.stats{display:flex;gap:16px;font-size:14px;color:var(--muted);padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stats b{color:var(--fg)}

/* sticky reply box */
.replybox{display:flex;gap:10px;align-items:flex-end;padding-block:10px;border-top:1px solid var(--line);background:var(--surface)}
.replybox textarea{flex:1;border:1px solid var(--line);border-radius:20px;padding:9px 14px;min-height:40px;max-height:120px;resize:none;outline:none;background:var(--surface-2)}
.send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.send[disabled]{opacity:.4}

/* DM */
.dmlist .item{display:flex;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line);cursor:pointer}
.unread{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:none}
.chat{display:flex;flex-direction:column;gap:4px;padding-block:14px}
.bub{max-width:76%;padding:8px 13px;border-radius:19px;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.bub.sys{align-self:center;background:none;color:var(--muted);font-size:12.5px;text-align:center;max-width:90%}
.daysep{align-self:center;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.receipt{align-self:flex-end;font-size:11.5px;color:var(--muted);margin-top:-1px}
.typing{align-self:flex-start;background:var(--surface-2);border-radius:19px;padding:12px 15px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* gauges */
.gauge{display:flex;flex-direction:column;gap:5px}
.gauge .lbl{display:flex;justify-content:space-between;font-size:13px}
.gauge .trk{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative}
.gauge .fill{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.relbar{height:6px;border-radius:4px;background:var(--surface-2);position:relative;overflow:hidden}
.relbar .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.relbar .fill{position:absolute;top:0;bottom:0;border-radius:4px}

/* sections & cards */
.sec{padding-block:16px;border-bottom:1px solid var(--line)}
.sec h3{font-size:17px;margin-bottom:10px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface)}
.card.event{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.kicker{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statbox{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.statbox .v{font-family:var(--font-display);font-size:20px}
.list-plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

/* home worlds */
.world{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--surface)}
.world:hover{border-color:var(--accent)}
.world .em{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:28px;flex:none}
.preset{display:flex;flex-direction:column;gap:6px;padding:13px;border:1px solid var(--line);border-radius:var(--r);text-align:left;background:var(--surface)}
.preset[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.preset .em{font-size:26px}
.hero-home{padding-block:22px 6px}
.hero-home h1{font-size:30px;letter-spacing:-.01em}
.hero-home h1 em{font-style:normal;color:var(--accent)}

/* sheet (modal) */
.scrim{position:fixed;inset:0;background:rgba(15,5,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim.in{animation:fade .18s} .scrim.in .sheet{animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet{width:100%;max-width:var(--col);max-height:92%;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.full{height:100%;max-height:100%;border-radius:0}
.sheet .sh-head{display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.sheet .sh-head h2{font-size:18px;flex:1}
.sheet .sh-body{flex:1;overflow-y:auto;padding-block:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toast / outcome */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(440px,calc(100% - 32px));box-shadow:var(--shadow);text-align:center}
#outcome{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:55;width:min(440px,calc(100% - 32px));border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line);animation:drop .35s cubic-bezier(.2,.9,.3,1.3)}
#outcome .big{font-family:var(--font-display);font-size:22px}
#outcome.viral{border-color:var(--accent)} #outcome.viral .big{color:var(--accent)}
#outcome.cancelled{border-color:var(--bad)} #outcome.cancelled .big{color:var(--bad)}
#outcome.drama .big{color:var(--violet)}
.deltas{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.delta{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2)}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
@keyframes drop{from{transform:translate(-50%,-24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* thinking */
.thinking{display:flex;align-items:center;gap:10px;padding-block:12px;color:var(--muted);font-size:14px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.notice{margin-block:10px;padding:10px 13px;border-radius:12px;background:var(--gold-soft);color:var(--fg);font-size:13.5px}

/* story viewer */
.sv{position:fixed;inset:0;z-index:70;background:#0c0709;display:flex;justify-content:center}
.sv .frame{width:100%;max-width:var(--col);height:100%;display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sv .bars{display:flex;gap:4px;padding:10px 12px 6px}
.sv .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.sv .bars i b{display:block;height:100%;background:#fff;width:0}
.sv .card-s{flex:1;margin:6px 10px;border-radius:18px;display:grid;place-items:center;padding:28px;text-align:center;font-family:var(--font-display);font-size:26px;line-height:1.35;position:relative;word-break:break-word}
.sv .nav{position:absolute;top:0;bottom:0;width:35%}
.sv .nav.l{left:0}.sv .nav.r{right:0}

/* activity scene */
.scene{display:flex;flex-direction:column;gap:12px}
.narr{font-style:italic;color:var(--muted);white-space:pre-wrap}
.line{white-space:pre-wrap}
.line b{font-weight:700}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.opt:hover{border-color:var(--accent)}

/* achievements */
.ach{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ach .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface-2);flex:none}
.ach.locked{opacity:.45}

.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty .em{font-size:40px;margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* avatars as images over an emoji fallback */
.av{overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
/* post & story photos */
.pimg{margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);aspect-ratio:1/1;max-width:100%;width:100%;max-width:400px;position:relative}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg.ph{display:grid;place-items:center;padding:18px;text-align:center;color:var(--muted);font-size:13px;font-style:italic;background:linear-gradient(110deg,var(--surface-2) 30%,color-mix(in srgb,var(--surface-2) 60%,var(--surface)) 50%,var(--surface-2) 70%);background-size:220% 100%;animation:shim 1.6s linear infinite}
.pimg.ph b{display:block;font-style:normal;font-size:22px;margin-bottom:6px}
@keyframes shim{to{background-position:-220% 0}}
.thread-main .pimg{max-width:100%}
.sv .card-s .sv-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}

<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast" hidden></div>
<script>
"use strict";
/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = (p = "") => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const num = v => { v = Number(v); return Number.isFinite(v) ? v : 0; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const todayKey = () => { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
function fmt(n) {
  n = Math.round(num(n));
  const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
  if (a >= 1e4) return (n / 1e3).toFixed(0) + "K";
  if (a >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}
const sign = n => (n > 0 ? "+" : "") + fmt(n);
const COLORS = ["#F7C6D9", "#C9D8FF", "#FFE0A8", "#C8F0DA", "#E3D4FF", "#FFD0C2", "#BFEFF2", "#F2E6C9", "#D9F2B8", "#FFC9EC"];
const DCOLORS = ["#5B2238", "#24345E", "#5A4314", "#1E4A35", "#3B2D66", "#5C2F22", "#1C4A4D", "#4A4027", "#3A4A1E", "#5A2350"];
const isDark = () => document.documentElement.dataset.theme === "dark" || (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
function hashN(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function avStyle(a, key) { const i = a && Number.isInteger(a.c) ? a.c : hashN(key) % COLORS.length; return `background:${(isDark() ? DCOLORS : COLORS)[i % COLORS.length]}`; }

/* ---------- avatars: DiceBear illustrations (free, no key) over an emoji fallback ---------- */
const AV_STYLES = ["notionists", "lorelei", "adventurer", "micah", "personas", "open-peeps", "big-smile"];
function avURL(a, key) {
  const st = (a && a.st) || AV_STYLES[hashN(key) % 5];
  const seed = (a && a.sd) || key;
  return `https://api.dicebear.com/9.x/${st}/svg?seed=${encodeURIComponent(seed)}`;
}
/* profile pictures, in order: a real photo (av.img), an aesthetic photo found on Wikimedia Commons
   for the account's picture phrase (av.pic, "aesthetic" mode), an illustration ("cartoon" mode), the emoji */
const avMode = () => (S.G && S.G.avMode) || "aesthetic";
const imgTag = src => `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`;
function derivePic(name, handle, bio) { return `${String(handle || "").replace(/[^a-z]+/gi, " ")} ${String(bio || "").slice(0, 60)}`.trim() || String(name || ""); }
function avatar(a, key, size = "", extra = "") {
  const mode = avMode();
  let img = "", wait = "";
  if (a && a.img) img = imgTag(a.img);
  else if (mode === "aesthetic" && a && a.pic) {
    const u = PICS[a.pic];
    if (u) img = imgTag(u); else if (u === undefined) { queuePic(a.pic); wait = ` data-avk="${"pk" + hashN(a.pic)}"`; }
  } else if (mode === "cartoon") img = imgTag(avURL(a, key));
  return `<div class="av ${size} ${extra}" style="${avStyle(a, key)}" aria-hidden="true"${wait}><span>${esc((a && a.e) || "🙂")}</span>${img}</div>`;
}

/* ================= icons ================= */
const P = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  compass: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  mail: '<path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.4A8.5 8.5 0 1 1 21 12z"/>',
  bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  heart: '<path d="M12 20s-7.5-4.6-9.3-9.2C1.4 7.4 3.6 4 7.1 4c2 0 3.6 1.1 4.9 2.9C13.3 5.1 14.9 4 16.9 4c3.5 0 5.7 3.4 4.4 6.8C19.5 15.4 12 20 12 20z"/>',
  rt: '<path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
  reply: '<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l1.9-5.1A8.4 8.4 0 1 1 21 11.5z"/>',
  views: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  zap: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  gem: '<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M12 21 8 9l4-6 4 6z"/>',
  rewind: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  send: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5" stroke-width="3.2"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  store: '<path d="M3 9 4.5 4h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v8h14v-8"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.7-8.7M17 6l2.5 2.5M14.5 8.5 16 10"/>'
};
const ic = (n, sw = 2) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ""}</svg>`;
const badge = () => `<span class="badge" title="Verified">${ic("check")}</span>`;

/* ================= state ================= */
const S = {
  G: null,          // global save: key, model, gems, settings, worlds index, library
  W: null,          // world being played
  key: null,        // OpenRouter key info from /api/v1/key
  models: null,     // free models list
  view: { screen: "home", tab: "feed", post: null, dm: null },
  busy: null, snaps: [], typing: {}
};
const MADNESS = ["", "Chill and wholesome", "A little drama", "Normal social media", "Messy, rumors everywhere", "Total chaos, anything goes"];
const CHEMS = ["Best friends", "Secret crush", "Shipped by fans", "Rivals", "Enemies", "Siblings", "Mentor", "Dating", "Exes", "Situationship", "Superfan", "Hater", "Strangers"];
const IMG_STYLES = { photo: "candid smartphone photo, natural light, realistic, social media post", anime: "anime illustration, vibrant, detailed, key visual style", art: "digital painting, cinematic lighting, detailed illustration" };

function newGlobal() {
  return { v: 2, savedAt: 0, apiKey: "", model: "", groqKey: "", groqModel: "", geminiKey: "", geminiModel: "", aiOrder: ["openrouter", "groq", "gemini"], gems: 30, theme: "", imgMode: "ai", avatars: true, avMode: "aesthetic",
    streak: { n: 0, last: "" }, ach: {}, library: [], worlds: [], req: { day: "", n: 0 },
    stats: { posts: 0, virals: 0, cancels: 0, events: 0, acts: 0 } };
}

/* ================= persistence (this browser's localStorage) ================= */
const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch { } }
};
let warnedFull = false;
function saveMeta() { S.G.savedAt = Date.now(); if (!LS.set("mc_meta", S.G) && !warnedFull) { warnedFull = true; toast("Browser storage is full. Delete a world or export your save."); } cloudDirty("meta"); }
function pruneWorld(W) {
  W.posts = W.posts.slice(0, 160);
  for (const p of W.posts) if (p.replies && p.replies.length > 24) p.replies = p.replies.slice(-24);
  for (const k in W.dms) if (W.dms[k].length > 100) W.dms[k] = W.dms[k].slice(-100);
  W.notifs = W.notifs.slice(0, 80);
  W.log = W.log.slice(-45);
  W.stories = W.stories.filter(s => s.day >= W.day - 1).slice(-30);
  const ks = Object.keys(W.npcs || {}); if (ks.length > 120) ks.sort((a, b) => W.npcs[a].seen - W.npcs[b].seen).slice(0, ks.length - 120).forEach(k => delete W.npcs[k]);
}
let tWorld = 0;
function saveWorld() {
  const W = S.W; if (!W) return;
  pruneWorld(W); W.savedAt = Date.now();
  const idx = S.G.worlds.find(x => x.id === W.id);
  if (idx) Object.assign(idx, { day: W.day, followers: W.me.followers, name: W.name, emoji: W.emoji, last: Date.now(), me: W.me.name });
  saveMeta(); cloudDirty("world", W.id);
  clearTimeout(tWorld);
  tWorld = setTimeout(() => { if (!LS.set("mc_w_" + W.id, W) && !warnedFull) { warnedFull = true; toast("Browser storage is full. Delete a world or export your save."); } }, 300);
}
function flushWorld() { if (S.W) { clearTimeout(tWorld); LS.set("mc_w_" + S.W.id, S.W); } }
addEventListener("pagehide", () => { flushWorld(); cloudPush(); });
async function loadWorld(id) { return LS.get("mc_w_" + id); }

/* ================= cloud save (Supabase, optional) =================
   localStorage stays the working copy, so the game keeps running offline. When signed in, every
   save is queued (the queue itself survives reloads) and uploaded a moment later. On sign-in and
   whenever the app comes back to the foreground the cloud copy is merged in: per world the newest
   savedAt wins, deleted worlds stay deleted (tombstones), and the global save keeps the newest
   copy while merging achievements, stats and the list of worlds from both sides. */
const CFG = window.MC_CONFIG || {};
const CLOUD = {
  sb: null, user: null, state: "off", err: "", last: 0, pulled: 0, pushing: false, pulling: false, applying: false, t: 0,
  q: Object.assign({ meta: false, worlds: [], deleted: [] }, LS.get("mc_cloud_q") || {})
};
const qEmpty = () => !CLOUD.q.meta && !CLOUD.q.worlds.length && !CLOUD.q.deleted.length;
function saveQ() { LS.set("mc_cloud_q", CLOUD.q); }
function cloudDirty(kind, id) {
  if (CLOUD.applying || CLOUD.state === "off") return;
  const q = CLOUD.q;
  if (kind === "meta") q.meta = true;
  else if (kind === "world") { if (!q.worlds.includes(id)) q.worlds.push(id); q.deleted = q.deleted.filter(x => x !== id); }
  else if (kind === "del") { q.worlds = q.worlds.filter(x => x !== id); if (!q.deleted.includes(id)) q.deleted.push(id); }
  saveQ(); schedulePush();
}
function schedulePush(ms = 1500) { if (!CLOUD.user) return; clearTimeout(CLOUD.t); CLOUD.t = setTimeout(cloudPush, ms); }
function setCloud(state, err) {
  CLOUD.state = state; CLOUD.err = err || "";
  document.querySelectorAll(".cdot").forEach(el => el.className = "cdot " + state);
  if (S.sheet && S.sheet.fn === sheetAccount) refreshSheet();
}
/* what goes to the cloud: never the API key; request counts and the account owner are per device */
const KEY_FIELDS = ["apiKey", "groqKey", "geminiKey"];
function cloudMeta(G = S.G) { const m = JSON.parse(JSON.stringify(G)); for (const k of KEY_FIELDS) delete m[k]; delete m.owner; delete m.req; return m; }
const localKeys = G => Object.fromEntries(KEY_FIELDS.map(k => [k, (G && G[k]) || ""]));
function mergeMeta(local, remote, remoteWins) {
  const base = remoteWins ? remote : local, other = remoteWins ? local : remote;
  const G = Object.assign(newGlobal(), base, localKeys(local), { owner: local.owner, req: local.req || { day: "", n: 0 } });
  G.stats = Object.assign(newGlobal().stats, base.stats);
  for (const k in (other.stats || {})) G.stats[k] = Math.max(num(G.stats[k]), num(other.stats[k]));
  G.ach = Object.assign({}, other.ach || {}, base.ach || {});
  G.worlds = [...(base.worlds || [])];
  for (const w of (other.worlds || [])) if (w && !G.worlds.some(x => x.id === w.id)) G.worlds.push(w);
  return G;
}
function worldIndex(w, last) { return { id: w.id, name: w.name, emoji: w.emoji, day: w.day, followers: w.me && w.me.followers, me: w.me && w.me.name, last: last || Date.now(), sample: w.sample || undefined }; }

async function cloudPush() {
  const sb = CLOUD.sb, u = CLOUD.user, q = CLOUD.q;
  if (!sb || !u || !CLOUD.pulled || CLOUD.pushing || CLOUD.pulling || qEmpty()) return;
  if (!navigator.onLine) return setCloud("offline");
  CLOUD.pushing = true; setCloud("syncing");
  const now = () => new Date().toISOString();
  try {
    if (q.meta) {
      q.meta = false;
      const { error } = await sb.from("mc_meta").upsert({ user_id: u.id, data: cloudMeta(), saved_at: num(S.G.savedAt), updated_at: now() });
      if (error) { q.meta = true; throw error; }
    }
    for (const id of [...q.worlds]) {
      q.worlds = q.worlds.filter(x => x !== id);   // a save made during the upload re-queues it
      const w = S.W && S.W.id === id ? S.W : LS.get("mc_w_" + id);
      if (!w) continue;
      const { error } = await sb.from("mc_worlds").upsert({ user_id: u.id, world_id: id, data: w, saved_at: num(w.savedAt), deleted: false, updated_at: now() });
      if (error) { if (!q.worlds.includes(id)) q.worlds.push(id); throw error; }
    }
    for (const id of [...q.deleted]) {
      const { error } = await sb.from("mc_worlds").upsert({ user_id: u.id, world_id: id, data: null, saved_at: Date.now(), deleted: true, updated_at: now() });
      if (error) throw error;
      q.deleted = q.deleted.filter(x => x !== id);
    }
    CLOUD.last = Date.now(); setCloud("ok");
  } catch (e) {
    setCloud(navigator.onLine ? "error" : "offline", e && e.message);
    clearTimeout(CLOUD.t); CLOUD.t = setTimeout(cloudPush, 20000);
  } finally {
    CLOUD.pushing = false; saveQ();
    if (CLOUD.state === "ok" && !qEmpty()) schedulePush(300);
  }
}

async function cloudPull() {
  const sb = CLOUD.sb, u = CLOUD.user;
  if (!sb || !u || CLOUD.pulling || CLOUD.pushing) return;
  if (!navigator.onLine) { setCloud("offline"); return; }
  CLOUD.pulling = true; setCloud("syncing");
  try {
    const [m, rows] = await Promise.all([
      sb.from("mc_meta").select("data,saved_at").eq("user_id", u.id).maybeSingle(),
      sb.from("mc_worlds").select("world_id,saved_at,deleted").eq("user_id", u.id)
    ]);
    if (m.error) throw m.error;
    if (rows.error) throw rows.error;
    const q = CLOUD.q, local = S.G, fresh = local.owner !== u.id, rm = m.data;
    // which worlds to download, which to upload, which are gone
    const dead = new Set(q.deleted), need = [], push = [];
    const localOf = id => S.W && S.W.id === id ? S.W : LS.get("mc_w_" + id);
    for (const r of rows.data || []) {
      const id = r.world_id; if (dead.has(id)) continue;
      const lw = localOf(id), ls = lw ? num(lw.savedAt) : -1, rs = num(r.saved_at);
      if (r.deleted) {
        if (lw && (ls > rs || q.worlds.includes(id))) push.push(id);           // edited here after it was deleted elsewhere: keep it
        else if (!(S.W && S.W.id === id && isBusy())) dead.add(id);
      } else if (rs > ls && !q.worlds.includes(id)) need.push(id);
      else if (ls > rs) push.push(id);
    }
    let got = [];
    if (need.length) {
      const res = await sb.from("mc_worlds").select("world_id,data,saved_at").eq("user_id", u.id).in("world_id", need);
      if (res.error) throw res.error;
      got = res.data || [];
    }
    CLOUD.applying = true;
    // global save
    const remoteWins = !!(rm && rm.data) && (fresh || (num(rm.saved_at) > num(local.savedAt) && !q.meta));
    const G = rm && rm.data ? mergeMeta(local, Object.assign({}, rm.data, { savedAt: num(rm.saved_at) }), remoteWins) : local;
    if (fresh && rm && rm.data) for (const l of local.library) if (!G.library.some(x => x.id === l.id)) G.library.push(l);   // keep characters made before signing in
    G.owner = u.id;
    for (const r of got) {
      if (!r.data) continue;
      const w = normalizeWorld(r.data); w.savedAt = num(r.saved_at);
      LS.set("mc_w_" + r.world_id, w);
      const i = G.worlds.findIndex(x => x.id === r.world_id), entry = worldIndex(w, num(r.saved_at));
      if (i >= 0) G.worlds[i] = Object.assign(G.worlds[i], entry); else G.worlds.push(entry);
      if (S.W && S.W.id === r.world_id && !isBusy()) { S.W = w; S.snaps = []; }
    }

    for (const x of (r.replies || []).slice(0, 8)) if (x && x.text) p.replies.push({ id: uid("r"), a: authorFrom(W, x.handle, x.name, x), t: String(x.text), likes: rnd(0, Math.max(3, p.likes / 8)), ts: Date.now() });
    const d = applyStats(r, useClout ? 2 : 1);
    const rels = applyRels(r.relationship_changes);
    addPosts(r.character_posts);
    if (r.news_post && !W.muteNews) addPosts([r.news_post], "news");
    proactiveDM(r.dm);
    remember(r.memory || `${me.name} posted: ${p.t.slice(0, 80)}`);
    S.G.stats.posts++; if (out === "viral") S.G.stats.virals++; if (out === "cancelled") S.G.stats.cancels++;

    if (p.replies.length) notify("reply", `${p.replies.length} people replied to your post`, { post: p.id });
    if (d.followers > 0) notify("follow", `${fmt(d.followers)} new followers`);

    restoreSnap(); failed(e);

async function actTurn(text) {
  const W = S.W, A = W.act; if (!A || A.done || A.busy || !text.trim() || guard()) return;
  const c = W.chars.find(x => x.id === A.cid); if (!c) return;
  A.hist.push(JSON.stringify({ lines: A.lines, options: A.options, turns: A.turns, rel: c.rel }));
  A.lines.push({ k: "me", t: text.trim() }); A.options = []; A.busy = true; A.turns++;
  renderActivity();
  const finish = A.turns >= 6;
  const scene = A.lines.slice(-14).map(l => l.k === "narr" ? `[${l.t}]` : l.k === "char" ? `${c.name}: ${l.t}` : `${W.me.name}: ${l.t}`).join("\n");
  const prompt = `${ctx(W, { posts: 3 })}

INTERACTIVE SCENE with ${c.name} — activity: ${A.title}
Character card: ${c.desc || c.bio}. Relationship ${Math.round(c.rel)}/100${c.chem ? ", " + c.chem : ""}.
Scene so far:
${scene}

Continue the scene, reacting to the player's last action. ${finish ? "This is the FINAL beat: wrap the scene up with a satisfying ending and set done to true." : "Keep it moving; end the scene (done true) only if it naturally concludes."}
Reply with ONLY this JSON:
{"narration":"1-3 sentences, second person","line":"${c.name}'s spoken line (can be empty)","options":["next player option","another","another"],"relationship_change":0,"done":false,"summary":"if done: one sentence summary for story memory, else empty"}
relationship_change between -8 and 8.`;
  try {
    const r = await ai(prompt);
    if (r.narration) A.lines.push({ k: "narr", t: String(r.narration) });
    if (r.line) A.lines.push({ k: "char", t: String(r.line) });
    c.rel = clamp(num(c.rel) + clamp(Math.round(num(r.relationship_change)), -8, 8), -100, 100);
    A.options = (r.options || []).slice(0, 3).map(String);
    if (r.done || finish) {
      A.done = true; A.options = [];
      remember(r.summary || `${W.me.name} and ${c.name}: ${A.title}`);
      S.G.stats.acts++; addXP(40); checkAch();
    }
  } catch (e) {
    const h = A.hist.pop(); if (h) { const o = JSON.parse(h); A.lines = o.lines; A.options = o.options; A.turns = o.turns; c.rel = o.rel; }
    failed(e);
  } finally { A.busy = false; saveWorld(); renderActivity(); }
}
function actUndo() {
  const W = S.W, A = W.act; if (!A || A.busy || !A.hist.length) return;
  const c = W.chars.find(x => x.id === A.cid);
  const o = JSON.parse(A.hist.pop()); A.lines = o.lines; A.options = o.options; A.turns = o.turns; A.done = false; if (c) c.rel = o.rel;
  saveWorld(); renderActivity();
}

function renderWorld() {
  const W = S.W, v = S.view;
  const unN = W.notifs.filter(n => !n.read).length, unD = unreadDMs(W);
  let body;
  if (v.post) body = viewThread();
  else if (v.dm) body = viewChat();
  else body = ({ feed: viewFeed, explore: viewExplore, dms: viewDMs, notifs: viewNotifs, profile: viewProfile }[v.tab] || viewFeed)();
  const tab = (id, icon, label, n) => `<button data-act="tab" data-id="${id}" ${v.tab === id && !v.post && !v.dm ? 'aria-current="page"' : ""}>${ic(icon)}${n ? `<span class="dot num">${n > 9 ? "9+" : n}</span>` : ""}<span>${label}</span></button>`;
  return `
  <header class="top gut"><div class="row" style="gap:6px">
    <button class="iconbtn" data-act="${v.post || v.dm ? "back" : "home"}" aria-label="Back">${ic("back")}</button>
    <div class="grow" style="line-height:1.2">
      <div style="font-family:var(--font-display);font-size:17px" class="ell">${esc(W.emoji)} ${esc(W.name)}</div>
      <div class="tiny muted ell">Day ${W.day} · ${esc(W.calendar ? dateLabel(W) : W.sandbox ? eraLabel(W.sandbox) + " · " + W.sandbox.place : MADNESS[W.madness])}</div>
    </div>
    ${meterPill()}
    <button class="iconbtn" data-act="rewind" aria-label="Rewind" title="Rewind your last action" ${S.snaps.length ? "" : 'style="opacity:.35"'}>${ic("rewind")}</button>
  </div></header>
  ${body}
  <nav class="tabs" aria-label="Main">
    ${tab("feed", "home", "Feed")}${tab("explore", "compass", "Explore", W.events.filter(e => !e.done).length + W.invites.length)}${tab("dms", "mail", "Messages", unD)}${tab("notifs", "bell", "Activity", unN)}${tab("profile", "user", "Profile")}
  </nav>`;
}

function authorInfo(W, a) {
  if (a === "me") return { name: W.me.name, handle: W.me.handle, av: W.me.av, key: "me", verified: W.me.followers >= 10000, kind: "me" };
  if (a && typeof a === "object") { const n = W.npcs && W.npcs[String(a.h).toLowerCase()]; return { name: a.n, handle: a.h, av: { e: a.e, c: a.c, st: a.st, pic: a.pic || (n && n.pic) || derivePic(a.n, a.h) }, key: a.h, verified: false, kind: "rand" }; }
  const c = W.chars.find(x => x.id === a) || { name: "user", handle: "user", av: { e: "🙂" }, id: "x" };
  return { name: c.name, handle: c.handle, av: c.av, key: c.id, verified: c.kind === "news" || num(c.followers) >= 10000, kind: c.kind || "char", id: c.id };
}
const profA = A => A.kind === "rand" ? "rand:" + A.handle : A.kind === "me" ? "me" : A.id;
const TAGS = { viral: ["viral", "🔥 Viral"], cancelled: ["cancel", "💀 Cancelled"], flop: ["news", "🥶 Flopped"], drama: ["drama", "🍿 Drama"], news: ["news", "📰 News"] };
function postHTML(p) {
  const W = S.W, A = authorInfo(W, p.a), tg = p.tag && TAGS[p.tag];
  return `<article class="post gut" data-act="openPost" data-id="${esc(p.id)}">
    <div data-act="profileOf" data-a="${esc(profA(A))}">${avatar(A.av, A.key, "", A.kind === "news" ? "news" : "")}</div>
    <div class="grow">
      <div class="who"><span class="name">${esc(A.name)}</span>${A.verified ? badge() : ""}<span class="handle">@${esc(A.handle)} · day ${p.day}</span></div>
      ${p.t ? `<div class="text">${esc(p.t)}</div>` : ""}
      ${photoHTML(p.img)}
      ${p.pending ? `<div class="tiny muted" style="margin-top:6px">Posting…</div>` : ""}
      ${tg ? `<span class="tag ${tg[0]}">${tg[1]}</span>` : ""}
      <div class="acts num">
        <button data-act="openPost" data-id="${esc(p.id)}" aria-label="Reply">${ic("reply")}${fmt(p.replies.length)}</button>
        <button data-act="rt" data-id="${esc(p.id)}" class="${p.rted ? "on-rt" : ""}" aria-label="Repost">${ic("rt")}${fmt(p.rts)}</button>
        <button data-act="like" data-id="${esc(p.id)}" class="${p.liked ? "on-like" : ""}" aria-label="Like">${ic("heart")}${fmt(p.likes)}</button>
        <span style="display:inline-flex;align-items:center;gap:5px">${ic("views")}${fmt(p.views)}</span>
      </div>
    </div></article>`;
}

/* ---------- feed ---------- */
const STORY_BG = ["linear-gradient(160deg,#E8285F,#7A2BE2)", "linear-gradient(160deg,#FF8A3D,#E8285F)", "linear-gradient(160deg,#2F6BFF,#18B5A5)", "linear-gradient(160deg,#3A1C71,#D76D77)", "linear-gradient(160deg,#0F9B6C,#B7D432)", "linear-gradient(160deg,#1B1418,#5B2238)"];
function viewFeed() {
  const W = S.W, me = W.me, v = S.view;
  const byA = {}; for (const s of W.stories) (byA[s.a] = byA[s.a] || []).push(s);
  const others = Object.keys(byA).filter(a => a !== "me").sort((a, b) => (byA[a].every(s => s.seen) ? 1 : 0) - (byA[b].every(s => s.seen) ? 1 : 0));
  const mine = byA.me || [];
  const storyItem = a => { const A = authorInfo(W, a); const seen = byA[a].every(s => s.seen); return `<button class="story" data-act="story" data-id="${esc(a)}"><span class="ring ${seen ? "seen" : ""}">${avatar(A.av, A.key, "md")}</span><span class="ell">${esc(A.name)}</span></button>`; };
  return `<main class="scroll">
    ${keyNotice()}${busyBar()}
    <div class="stories gut">
      <button class="story" data-act="${mine.length ? "story" : "myStory"}" data-id="me"><span class="ring ${mine.length && !mine.every(s => s.seen) ? "" : "seen"}" style="position:relative">${avatar(me.av, "me", "md")}<span class="plus" data-act="myStory">+</span></span><span class="ell">Your story</span></button>
      ${others.map(storyItem).join("")}
    </div>
    <div class="composer gut">
      ${avatar(me.av, "me")}
      <div class="grow">
        <label for="composer" class="sr">New post</label>
        <textarea id="composer" data-grow data-draft="draft" placeholder="What's happening?" maxlength="600">${esc(v.draft || "")}</textarea>
        ${v.photoOpen ? `<div class="row" style="margin-top:6px"><label for="photoIn" class="sr">Describe your photo</label><input class="in" id="photoIn" data-draft="photoDraft" maxlength="200" placeholder="Describe your photo (e.g. mirror selfie in a red jacket)" value="${esc(v.photoDraft || "")}"><button class="iconbtn" data-act="photoToggle" aria-label="Remove photo">${ic("x")}</button></div>` : ""}
        <div class="bar">
          <button class="boost" data-act="photoToggle" aria-pressed="${!!v.photoOpen}">📷 Photo</button>
          <button class="boost" data-act="boost" data-id="viral" aria-pressed="${!!v.boostViral}" ${me.boosts.viral ? "" : "disabled style='opacity:.5'"}>🚀 Viral ×${me.boosts.viral}</button>
          <button class="boost" data-act="boost" data-id="clout" aria-pressed="${!!v.boostClout}" ${me.boosts.clout ? "" : "disabled style='opacity:.5'"}>📣 Clout ×${me.boosts.clout}</button>
          <span class="grow"></span>
          <button class="btn accent sm" data-act="post" ${isBusy() ? "disabled" : ""}>Post</button>
        </div>
      </div>
    </div>
    ${W.posts.length ? W.posts.map(postHTML).join("") : `<div class="empty"><div class="em">📝</div>No posts yet. Make your first one.</div>`}
    <div style="height:30px"></div>
  </main>`;
}

/* ---------- thread ---------- */
function viewThread() {
  const W = S.W, p = W.posts.find(x => x.id === S.view.post);
  if (!p) { S.view.post = null; return viewFeed(); }
  const A = authorInfo(W, p.a), tg = p.tag && TAGS[p.tag];
  return `<main class="scroll">
    ${busyBar()}
    <div class="thread-main gut">
      <div class="row" data-act="profileOf" data-a="${esc(profA(A))}" style="cursor:pointer">${avatar(A.av, A.key, "", A.kind === "news" ? "news" : "")}
        <div class="grow"><div class="row" style="gap:5px"><b class="ell">${esc(A.name)}</b>${A.verified ? badge() : ""}</div><div class="small muted">@${esc(A.handle)}</div></div></div>
      ${p.t ? `<div class="text">${esc(p.t)}</div>` : ""}
      ${photoHTML(p.img)}
      ${tg ? `<span class="tag ${tg[0]}">${tg[1]}</span>` : ""}
      <div class="small muted" style="margin-top:10px">Day ${p.day} · ${esc(W.name)}</div>
    </div>
    <div class="stats gut num"><span><b>${fmt(p.rts)}</b> Reposts</span><span><b>${fmt(p.likes)}</b> Likes</span><span><b>${fmt(p.views)}</b> Views</span></div>
    <div class="actbar gut">
      <button data-act="focusReply">${ic("reply")}Reply</button>
      <button data-act="rt" data-id="${esc(p.id)}" class="${p.rted ? "on-rt" : ""}">${ic("rt")}Repost</button>
      <button data-act="like" data-id="${esc(p.id)}" class="${p.liked ? "on-like" : ""}">${ic("heart")}Like</button>
    </div>
    ${p.replies.map(r => { const R = authorInfo(W, r.a); return `<div class="post gut" style="cursor:default">
      <div data-act="profileOf" data-a="${esc(profA(R))}" style="cursor:pointer">${avatar(R.av, R.key, "sm", R.kind === "news" ? "news" : "")}</div>
      <div class="grow"><div class="who"><span class="name">${esc(R.name)}</span>${R.verified ? badge() : ""}<span class="handle">@${esc(R.handle)}</span></div>
      <div class="small muted">Replying to @${esc(A.handle)}</div>
      <div class="text">${esc(r.t)}</div>
      <div class="acts num" style="max-width:120px"><span style="display:inline-flex;gap:5px;align-items:center">${ic("heart")}${fmt(r.likes)}</span></div></div></div>`; }).join("")}
    ${p.pending || p.replies.length ? "" : `<div class="tiny muted gut" style="padding-block:14px;text-align:center">No replies yet</div>`}
  </main>
  <div class="replybox gut">
    <label for="replyIn" class="sr">Reply</label>
    <textarea id="replyIn" data-grow data-draft="replyDraft" rows="1" placeholder="Post your reply" maxlength="400">${esc(S.view.replyDraft || "")}</textarea>
    <button class="send" data-act="reply" data-id="${esc(p.id)}" aria-label="Send" ${isBusy() ? "disabled" : ""}>${ic("send", 2.4)}</button>
  </div>`;
}
/* ---------- explore: day, trends, events, invites, activities ---------- */
const ACT_IDEAS = ["Grab coffee together", "Go live together", "Shoot content for socials", "Hit a party tonight", "Talk backstage in secret", "Late-night practice", "Walk the night market", "Movie night"];
function viewExplore() {
  const W = S.W, v = S.view;
  const circle = W.chars.filter(c => c.unlocked && c.kind !== "news");
  const pending = W.events.filter(e => !e.done), done = W.events.filter(e => e.done).slice(-3).reverse();
  if (!v.actChar || !circle.some(c => c.id === v.actChar)) v.actChar = circle[0]?.id || null;
  return `<main class="scroll">
    ${keyNotice()}${busyBar()}
    ${W.sandbox ? `<section class="sec gut"><div class="card col" style="gap:6px;border-color:color-mix(in srgb,var(--violet) 45%,var(--line))">
      <div class="row"><div class="grow"><div class="kicker" style="color:var(--violet)">📜 Story setup</div><b>${esc(eraLabel(W.sandbox))} · ${esc(W.sandbox.place)}</b></div><button class="btn sm soft" data-act="setup">Change</button></div>
      <div class="small muted">You are ${esc(W.sandbox.role)}.${W.sandbox.situation ? " " + esc(W.sandbox.situation) : ""}</div></div></section>` : ""}
    <section class="sec gut">
      <div class="kicker">Day ${W.day}</div><h3 style="margin:2px 0 0">Move the story forward</h3>
      <div class="small muted">Start a new day: characters post, new events appear, and what you did comes back around.</div>
      <button class="btn block" style="margin-top:12px" data-act="nextDay" ${isBusy() ? "disabled" : ""}>${ic("sun")} Start day ${W.day + 1}</button>
    </section>
    ${W.trends.length ? `<section class="sec gut"><h3>Trending</h3><div class="row wrap" style="gap:8px">${W.trends.map((t, i) => `<button class="chip" data-act="useTrend" data-id="${esc(t)}"><span class="muted tiny num">${i + 1}</span>${esc(t)}</button>`).join("")}</div></section>` : ""}
    ${W.act && !W.act.done ? `<section class="sec gut"><div class="card"><div class="kicker">Scene in progress</div><div style="font-weight:700;margin:4px 0">${esc(W.act.title)}</div><button class="btn sm accent" data-act="resumeAct">Continue</button></div></section>` : ""}
    <section class="sec gut">
      <h3>Events</h3>
      ${pending.length ? `<div class="col">${pending.map(e => `
        <div class="card event">
          <div class="kicker">Day ${e.day}</div>
          <div style="font-weight:700;font-size:16px;margin:3px 0 4px">${esc(e.title)}</div>
          <div class="small" style="white-space:pre-wrap">${esc(e.desc)}</div>
          ${e.busy ? `<div class="thinking"><span class="spin"></span>Seeing how it plays out…</div>` : `
          <div class="col" style="margin-top:10px;gap:8px">
            ${e.choices.map(c => `<button class="opt" data-act="eventChoice" data-id="${esc(e.id)}" data-choice="${esc(c)}" ${isBusy() ? "disabled" : ""}>${esc(c)}</button>`).join("")}
            <div class="row"><label class="sr" for="ev_${esc(e.id)}">Your own choice</label><input class="in" id="ev_${esc(e.id)}" placeholder="Or write your own move" maxlength="200">
            <button class="btn sm" data-act="eventCustom" data-id="${esc(e.id)}" ${isBusy() ? "disabled" : ""}>Go</button></div>
            <div class="tiny muted">+30 XP</div>
          </div>`}
        </div>`).join("")}</div>` : `<div class="small muted">No events right now. Start a new day to stir things up.</div>`}
      ${done.length ? `<div class="col" style="margin-top:12px">${done.map(e => `<div class="card"><div class="small muted">${esc(e.title)} · you chose “${esc(e.choice)}”</div><div class="small" style="margin-top:4px;white-space:pre-wrap">${esc(e.result)}</div></div>`).join("")}</div>` : ""}
    </section>
    ${W.invites.length ? `<section class="sec gut"><h3>Invites</h3><div class="col">${W.invites.map(i => { const c = W.chars.find(x => x.id === i.cid); return c ? `<div class="card row">${avatar(c.av, c.id, "sm")}<div class="grow"><b>${esc(c.name)}</b><div class="small">${esc(i.act)}</div></div><button class="btn sm accent" data-act="acceptInvite" data-id="${esc(i.id)}">Go</button><button class="iconbtn" data-act="declineInvite" data-id="${esc(i.id)}" aria-label="Decline">${ic("x")}</button></div>` : ""; }).join("")}</div></section>` : ""}
    <section class="sec gut">
      <h3>Activities</h3>
      ${circle.length ? `
      <div class="small muted" style="margin-bottom:8px">Play a scene with a character, beat by beat. Pick an option or write your own, and undo a move if you want.</div>
      <div class="row wrap" style="gap:8px;margin-bottom:10px">${circle.map(c => `<button class="chip" data-act="actChar" data-id="${esc(c.id)}" aria-pressed="${v.actChar === c.id}">${esc(c.name)}</button>`).join("")}</div>
      <div class="row wrap" style="gap:8px;margin-bottom:10px">${ACT_IDEAS.map(a => `<button class="chip" data-act="actIdea" data-id="${esc(a)}">${esc(a)}</button>`).join("")}</div>
      <div class="row"><label class="sr" for="actIn">Activity</label><input class="in" id="actIn" data-draft="actDraft" value="${esc(v.actDraft || "")}" placeholder="Or type any activity" maxlength="120">
      <button class="btn sm accent" data-act="startAct">Start</button></div>
      <div class="tiny muted" style="margin-top:6px">Finish a scene for +40 XP</div>` : `<div class="small muted">No one in your circle yet.</div>`}
    </section>
    <div style="height:30px"></div>
  </main>`;
}

/* ---------- DMs ---------- */
function viewDMs() {
  const W = S.W;
  const list = W.chars.filter(c => c.unlocked && c.kind !== "news").map(c => { const m = W.dms[c.id] || []; return { c, last: m[m.length - 1] }; }).sort((a, b) => num(b.last?.ts) - num(a.last?.ts));
  return `<main class="scroll dmlist">
    ${keyNotice()}
    <div class="gut row" style="padding-block:14px 4px"><h3 class="grow" style="font-size:20px">Messages</h3><button class="btn sm soft" data-act="addChar">${ic("plus")} New</button></div>
    ${list.map(({ c, last }) => { const un = (W.dms[c.id] || []).some(m => m.f === "them" && m.ts > num(W.dmRead[c.id])); return `
      <div class="item gut" data-act="openDM" data-id="${esc(c.id)}" role="button" tabindex="0">
        ${avatar(c.av, c.id)}
        <div class="grow"><div class="row" style="gap:6px"><b class="ell">${esc(c.name)}</b>${c.chem ? `<span class="tiny muted ell">· ${esc(c.chem)}</span>` : ""}</div>
        <div class="small ${un ? "" : "muted"} ell" style="${un ? "font-weight:600" : ""}">${last ? (last.f === "me" ? "You: " : "") + esc(last.t) : "Say hi"}</div></div>
        ${un ? '<span class="unread"></span>' : ""}
      </div>`; }).join("") || `<div class="empty"><div class="em">💬</div>No one in your circle yet.</div>`}
  </main>`;
}
function relColor(r) { return r >= 0 ? "var(--good)" : "var(--bad)"; }
function relBar(r) { const w = Math.abs(r) / 2; return `<div class="relbar" title="Relationship ${Math.round(r)}"><span class="mid"></span><span class="fill" style="${r >= 0 ? "left:50%" : `left:${50 - w}%`};width:${w}%;background:${relColor(r)}"></span></div>`; }
function viewChat() {
  const W = S.W, c = W.chars.find(x => x.id === S.view.dm);
  if (!c) { S.view.dm = null; return viewDMs(); }
  W.dmRead[c.id] = Date.now();
  const msgs = W.dms[c.id] || [];
  let out = "", lastDay = null;
  const lastMe = msgs.map(m => m.f).lastIndexOf("me");
  msgs.forEach((m, i) => {
    if (m.day !== lastDay) { out += `<div class="daysep">Day ${m.day}</div>`; lastDay = m.day; }
    out += `<div class="bub ${m.f}">${esc(m.t)}</div>`;
    if (i === lastMe && i === msgs.length - 1 && !S.typing[c.id] && W.dmMeta[c.id]?.read) out += `<div class="receipt">Read</div>`;
  });
  return `<div class="gut" style="padding-block:10px;border-bottom:1px solid var(--line)">
      <div class="row" data-act="profileOf" data-a="${esc(c.id)}" style="cursor:pointer">${avatar(c.av, c.id, "sm")}
        <div class="grow"><div class="row" style="gap:5px"><b class="ell">${esc(c.name)}</b>${num(c.followers) >= 10000 ? badge() : ""}</div>
        <div class="tiny muted">${c.chem ? esc(c.chem) + " · " : ""}relationship ${Math.round(c.rel)}</div></div>
        <div style="width:80px">${relBar(c.rel)}</div></div></div>
    <main class="scroll"><div class="chat gut">
      ${out || `<div class="bub sys">Start a conversation with ${esc(c.name)}</div>`}
      ${S.typing[c.id] ? `<div class="typing" aria-label="typing"><i></i><i></i><i></i></div>` : ""}
    </div></main>
    <div class="replybox gut">
      <label for="dmIn" class="sr">Message</label>
      <textarea id="dmIn" data-grow data-draft="dmDraft" rows="1" placeholder="Message ${esc(c.name)}" maxlength="500">${esc(S.view.dmDraft || "")}</textarea>
      <button class="send" data-act="sendDM" data-id="${esc(c.id)}" aria-label="Send" ${isBusy() ? "disabled" : ""}>${ic("send", 2.4)}</button>
    </div>`;
}

/* ---------- notifications ---------- */
const NIC = { like: "❤️", reply: "💬", follow: "👤", dm: "✉️", level: "⬆️", milestone: "🏁", event: "🎭", ach: "🏆", news: "📰" };
function viewNotifs() {
  const W = S.W;
  const html = W.notifs.map(n => `<div class="post gut" style="${n.read ? "" : "background:color-mix(in srgb,var(--accent-soft) 45%,transparent)"}" data-act="notif" data-id="${esc(n.id)}">
    <div style="width:34px;text-align:center;font-size:20px">${NIC[n.k] || "🔔"}</div>
    <div class="grow"><div>${esc(n.t)}</div><div class="tiny muted">${new Date(n.ts).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" })}</div></div></div>`).join("");
  setTimeout(() => { if (S.W === W && S.view.tab === "notifs" && W.notifs.some(n => !n.read)) { W.notifs.forEach(n => n.read = true); saveWorld(); } }, 1500);
  return `<main class="scroll"><div class="gut" style="padding-block:14px 4px"><h3 style="font-size:20px">Activity</h3></div>${html || `<div class="empty"><div class="em">🔔</div>Nothing new yet</div>`}</main>`;
}

/* ---------- profile ---------- */
function gauge(label, val, color, max = 100) {
  return `<div class="gauge"><div class="lbl"><span>${label}</span><b class="num">${Math.round(val)}</b></div><div class="trk"><div class="fill" style="width:${clamp(val / max * 100, 2, 100)}%;background:${color}"></div></div></div>`;
}
function viewProfile() {
  const W = S.W, me = W.me, G = S.G;
  const circle = W.chars.filter(c => c.unlocked && c.kind !== "news"), locked = W.chars.filter(c => !c.unlocked && c.kind !== "news");
  const myPosts = W.posts.filter(p => p.a === "me"), doneM = me.milestones.filter(m => m.done).length;
  return `<main class="scroll">
    <section class="gut" style="padding-block:18px 14px;border-bottom:1px solid var(--line)">
      <div class="row" style="align-items:flex-start">${avatar(me.av, "me", "lg")}<span class="grow"></span>
        <button class="btn ghost sm" data-act="editMe">${ic("edit")} Edit profile</button></div>
      <div class="row" style="gap:6px;margin-top:10px"><h2 style="font-size:22px">${esc(me.name)}</h2>${me.followers >= 10000 ? badge() : ""}</div>
      <div class="muted">@${esc(me.handle)}</div>
      ${me.bio ? `<p style="margin:8px 0 0;white-space:pre-wrap">${esc(me.bio)}</p>` : ""}
      <div class="row num" style="gap:16px;margin-top:10px"><span><b>${fmt(circle.length)}</b> <span class="muted">Following</span></span><span><b>${fmt(me.followers)}</b> <span class="muted">Followers</span></span></div>
    </section>

let tToast = 0;
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tToast); tToast = setTimeout(() => el.hidden = true, 3600); }
const OUT = { viral: "🔥 Viral!", cancelled: "💀 Cancelled", flop: "🥶 Flopped", drama: "🍿 Drama incoming", normal: "✅ Posted", mini: "" };
let tOut = 0;
function showOutcome(kind, headline, d, rels) {
  let el = $("#outcome"); if (el) el.remove();
  const ds = [];
  if (d.followers) ds.push(`<span class="delta ${d.followers > 0 ? "up" : "down"}">${sign(d.followers)} followers</span>`);
  if (d.humor) ds.push(`<span class="delta ${d.humor > 0 ? "up" : "down"}">${sign(d.humor)} humor</span>`);
  if (d.aura) ds.push(`<span class="delta ${d.aura > 0 ? "up" : "down"}">${sign(d.aura)} aura</span>`);
  for (const r of (rels || []).slice(0, 4)) ds.push(`<span class="delta ${r.d > 0 ? "up" : "down"}">${esc(r.name)} ${r.d > 0 ? "♥" : "💢"} ${sign(r.d)}</span>`);
  if (!OUT[kind] && !headline && !ds.length) return;
  el = document.createElement("div"); el.id = "outcome"; el.className = kind; el.setAttribute("role", "status");
  el.innerHTML = `${OUT[kind] ? `<div class="big">${OUT[kind]}</div>` : ""}${headline ? `<div class="small" style="margin-top:2px">${esc(headline)}</div>` : ""}${ds.length ? `<div class="deltas num">${ds.join("")}</div>` : ""}`;
  el.addEventListener("click", () => el.remove());
  document.body.appendChild(el);
  clearTimeout(tOut); tOut = setTimeout(() => el.remove(), 5200);
}

async function signOut(force) {

/* ---------- real profile photos from the web ----------
   Sources are Wikipedia article images and Wikimedia Commons: free, no key, CORS-enabled, and
   freely licensed (real photos of actors, not film stills). Uploads are shrunk to a 192px JPEG. */
const WIKI = "https://en.wikipedia.org/w/api.php?", COMMONS = "https://commons.wikimedia.org/w/api.php?";
const HP_ACTORS = { hp_harry: "Daniel Radcliffe", hp_hermione: "Emma Watson", hp_ron: "Rupert Grint", hp_ginny: "Bonnie Wright", hp_twins: "James and Oliver Phelps",
  hp_neville: "Matthew Lewis (actor)", hp_luna: "Evanna Lynch", hp_cho: "Katie Leung", hp_padma: "Afshan Azad", hp_angelina: "Tiana Benjamin", hp_draco: "Tom Felton",
  hp_pansy: "Scarlett Byrne", hp_blaise: "Louis Cordice", hp_umbridge: "Imelda Staunton", hp_mcgonagall: "Maggie Smith", hp_snape: "Alan Rickman",
  hp_dumbledore: "Michael Gambon", hp_hagrid: "Robbie Coltrane", hp_sirius: "Gary Oldman" };
const wikiJSON = (base, params) => fetch(base + new URLSearchParams(Object.assign({ format: "json", origin: "*" }, params))).then(r => r.json());
/* article title -> lead photo URL, following redirects; up to 40 titles per request */
async function wikiThumbs(titles) {
  const out = {};
  for (let i = 0; i < titles.length; i += 40) {
    const chunk = titles.slice(i, i + 40);
    const d = await wikiJSON(WIKI, { action: "query", titles: chunk.join("|"), prop: "pageimages", piprop: "thumbnail", pithumbsize: "256", redirects: "1" });
    const q = d.query || {}, norm = {}, red = {}, pages = {};
    for (const x of q.normalized || []) norm[x.from] = x.to;
    for (const x of q.redirects || []) red[x.from] = x.to;
    for (const p of Object.values(q.pages || {})) pages[p.title] = p;
    for (const t of chunk) { let f = norm[t] || t; f = red[f] || f; const p = pages[f]; if (p && p.thumbnail) out[t] = p.thumbnail.source; }
  }
  return out;
}
async function photoSearch(q) {
  const [a, b] = await Promise.allSettled([
    wikiJSON(WIKI, { action: "query", generator: "search", gsrsearch: q, gsrlimit: "6", prop: "pageimages", piprop: "thumbnail", pithumbsize: "256" }),
    wikiJSON(COMMONS, { action: "query", generator: "search", gsrsearch: "filetype:bitmap " + q, gsrnamespace: "6", gsrlimit: "18", prop: "imageinfo", iiprop: "url", iiurlwidth: "256" })
  ]);
  const res = [], seen = new Set(), add = (url, label) => { if (url && !seen.has(url)) { seen.add(url); res.push({ url, label }); } };
  const pages = v => Object.values((v && v.query && v.query.pages) || {}).sort((x, y) => x.index - y.index);
  if (a.status === "fulfilled") for (const p of pages(a.value)) add(p.thumbnail && p.thumbnail.source, p.title);
  if (b.status === "fulfilled") for (const p of pages(b.value)) { const ii = p.imageinfo && p.imageinfo[0]; add(ii && ii.thumburl, p.title.replace(/^File:/, "").replace(/\.\w+$/, "")); }
  if (a.status === "rejected" && b.status === "rejected") throw { message: "Can't reach Wikipedia right now" };
  return res;
}

async function aiPhotoQuery(c) {

  const r = await ai(`World / fandom: ${W.fandom || W.name}. Character: ${c.name} (@${c.handle}). ${String(c.desc || c.bio || "").slice(0, 300)}
I want a real photo to use as this character's profile picture. If the character was played by a real actor in a well-known live-action film or TV adaptation, give the actor's name exactly as their English Wikipedia article title. Otherwise give a short search phrase (3-6 words) for a fitting free stock photo of a person.
Reply with ONLY JSON: {"actor": "name or null", "query": "search phrase"}`);
  return (typeof r.actor === "string" && r.actor && r.actor !== "null") ? { q: r.actor, actor: r.actor } : { q: String(r.query || c.name) };

/* whole cast at once: known actors (and, for AI-made worlds, actors the AI names) -> Wikipedia photos */
async function castPhotos(quiet) {
  const W = S.W; if (!W || S.castBusy) return;
  const chars = W.chars.filter(c => c.kind !== "news" && !(c.av && c.av.img));
  if (!chars.length) return quiet || toast("Every character already has a photo");
  S.castBusy = true; if (!quiet) { toast("Looking for photos…"); refreshSheet(); }
  try {
    const names = {};
    for (const c of chars) { const a = c.actor || HP_ACTORS[c.id]; if (a) names[c.id] = a; }
    const rest = chars.filter(c => !names[c.id]);
    if (rest.length && !quiet && hasAI()) {
      try {
        const r = await ai(`World / fandom: ${W.fandom || W.name}. For each character below: if they are a canon character played by a real actor in a well-known live-action film or TV adaptation, give that actor's name exactly as their English Wikipedia article title, else null. Only answer when you are sure.
${rest.map(c => `@${c.handle}: ${c.name}`).join("\n")}
Reply with ONLY JSON like {"@handle": "Actor Name" or null}`);
        for (const c of rest) { const v = r["@" + c.handle] || r[c.handle]; if (typeof v === "string" && v.trim() && v !== "null") names[c.id] = v.trim(); }
      } catch (e) { failed(e); }
    }
    const thumbs = await wikiThumbs([...new Set(Object.values(names))]);
    let n = 0;
    for (const c of S.W.chars) { const u = names[c.id] && thumbs[names[c.id]]; if (u && !(c.av && c.av.img)) { c.av = Object.assign({}, c.av, { img: u }); c.actor = names[c.id]; n++; } }
    if (n) saveWorld();

  } catch (e) { if (!quiet) toast("Couldn't reach Wikipedia. Check your connection and try again."); }
  S.castBusy = false; render(); refreshSheet();
}

function shrinkImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const S2 = 192, cv = document.createElement("canvas"), s = Math.min(im.width, im.height);
        cv.width = cv.height = S2;
        cv.getContext("2d").drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, S2, S2);
        res(cv.toDataURL("image/jpeg", 0.82));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function openStories(startA) {
  const W = S.W, byA = {}; for (const s of W.stories) (byA[s.a] = byA[s.a] || []).push(s);
  const order = [startA, ...Object.keys(byA).filter(a => a !== startA && a !== "me" && !byA[a].every(s => s.seen))].filter(a => byA[a]);
  S.sv = { order, byA, ai: 0, si: 0 }; showStory();

function showStory() {
  const sv = S.sv;
  if (!sv || sv.ai >= sv.order.length) { S.sv = null; layer.innerHTML = ""; saveWorld(); render(); return; }
  const a = sv.order[sv.ai], list = sv.byA[a], s = list[sv.si]; s.seen = true;
  const A = authorInfo(S.W, a), src = s.img ? imgSrc(s.img, 720, 1280) : null;
  const ch = S.W.chars.find(c => c.id === a);
  layer.innerHTML = `<div class="sv"><div class="frame">
    <div class="bars">${list.map((x, i) => `<i><b style="width:${i < sv.si ? 100 : 0}%" ${i === sv.si ? 'id="svBar"' : ""}></b></i>`).join("")}</div>
    <div class="row" style="padding:4px 14px 6px">${avatar(A.av, A.key, "xs")}<b>${esc(A.name)}</b><span style="opacity:.7;font-size:13px">day ${s.day}</span><span class="grow"></span><button class="iconbtn" style="color:#fff" data-act="svClose" aria-label="Close">${ic("x")}</button></div>
    <div class="card-s ${src ? "photo" : ""}" style="background:${STORY_BG[s.bg % STORY_BG.length]}" ${s.img && !src ? `data-ikbg="${s.img.s}"` : ""}>${src ? `<img class="sv-photo" src="${esc(src)}" alt="">` : ""}<span>${esc(s.t || (s.img && !src ? "📷 " + s.img.d : ""))}</span>
      <button class="nav l" data-act="svPrev" aria-label="Previous"></button><button class="nav r" data-act="svNext" aria-label="Next"></button></div>
    ${a !== "me" && ch && ch.unlocked && ch.kind !== "news" ? `<div class="row" style="padding:8px 12px"><input class="in" id="svReply" placeholder="Reply to ${esc(A.name)}…" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff"><button class="send" data-act="svSend" data-id="${esc(a)}" aria-label="Send">${ic("send", 2.4)}</button></div>` : '<div style="height:12px"></div>'}
  </div></div>`;
  const bar = $("#svBar"); let start = performance.now();
  const tick = t => {
    if (!S.sv || !bar.isConnected) return;
    if (document.activeElement && document.activeElement.id === "svReply") { start = t - (parseFloat(bar.style.width) || 0) * 60; return requestAnimationFrame(tick); }
    const p = Math.min(100, (t - start) / 60); bar.style.width = p + "%";
    if (p >= 100) svStep(1); else requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function svStep(d) {
  const sv = S.sv; if (!sv) return;

  else if (sv.si >= sv.byA[sv.order[sv.ai]].length) { sv.ai++; sv.si = 0; }
  showStory();
}

function normalizeWorld(w) {
  for (const k of ["posts", "stories", "notifs", "log", "events", "invites", "trends", "chars"]) if (!Array.isArray(w[k])) w[k] = [];
  for (const k of ["dms", "dmRead", "dmMeta"]) if (!w[k] || typeof w[k] !== "object") w[k] = {};
  w.me = Object.assign({ name: "me", handle: "me", bio: "", look: "", av: { e: "😎", c: 0 }, followers: 100, humor: 10, aura: 10, xp: 0, level: 1, sp: 0, unlocks: 0, skills: [], goal: "", milestones: [], boosts: { viral: 0, clout: 0 } }, w.me || {});
  if (!w.me.boosts) w.me.boosts = { viral: 0, clout: 0 };
  for (const p of w.posts) { if (!Array.isArray(p.replies)) p.replies = []; p.pending = false; }
  if (!w.npcs || typeof w.npcs !== "object") w.npcs = {};
  for (const c of w.chars) { c.av = c.av || { e: "🙂" }; if (!c.av.pic) Object.assign(c.av, { pic: derivePic(c.name, c.handle, c.bio), picAuto: true }); }
  if (!w.me.av.pic) Object.assign(w.me.av, { pic: derivePic(w.me.name, w.me.handle, w.me.bio), picAuto: true });
  w.madness = clamp(num(w.madness) || 3, 1, 5); w.day = Math.max(1, num(w.day) || 1);
  if (w.act) w.act.busy = false;
  for (const e of w.events) e.busy = false;
  return w;
}
